services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    volumes:
      - ./repositories:/repositories:ro
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=INFO -Q diagnosis
    env_file:
      - .env
    volumes:
      - ./repositories:/repositories:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  index-worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=INFO -Q index
    env_file:
      - .env
    volumes:
      - ./repositories:/repositories:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ragent
      POSTGRES_USER: ragent
      POSTGRES_PASSWORD: ragent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragent -d ragent"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup:
    image: postgres:16-alpine
    profiles: ["maintenance"]
    command: ["sh", "/scripts/backup_metadata.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ragent
      PGUSER: ragent
      PGPASSWORD: ragent
      BACKUP_DIR: /backups
      BACKUP_KEEP: "${BACKUP_KEEP:-7}"
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
