# RAgent 本地/单机部署编排：API、诊断 Worker、索引 Worker、Redis 和 PostgreSQL。

# 本地待诊断项目的只读挂载集合。项目名必须对应 /repositories 下一级目录；
# 默认路径适用于当前 macOS 开发机，其他机器通过对应环境变量覆盖。
# 禁止 create_host_path，避免路径写错时 Docker 创建空目录并让诊断静默缺失代码。
x-ragent-repositories: &ragent-repositories
  - type: bind
    source: ${WAKY3_REPOSITORY_PATH:-/Users/wskyygyso/work/www/waky3}
    target: /repositories/waky3
    read_only: true
    bind:
      create_host_path: false
  - type: bind
    source: ${WAKY4_REPOSITORY_PATH:-/Users/wskyygyso/work/www/waky4}
    target: /repositories/waky4
    read_only: true
    bind:
      create_host_path: false
  - type: bind
    source: ${WAKY6_REPOSITORY_PATH:-/Users/wskyygyso/work/www/waky6}
    target: /repositories/waky6
    read_only: true
    bind:
      create_host_path: false

services:
  # HTTP API：处理认证、任务、报告、验证请求和前端页面。
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # 本地开发配置从 .env 读取；生产应由部署平台注入 Secret Manager 值。
    env_file:
      - .env
    # waky3、waky4、waky6 分别以只读目录挂载，禁止 API 修改被诊断项目代码。
    volumes: *ragent-repositories
    # 宿主机 8000 端口映射到 API 容器。
    ports:
      - "8000:8000"
    # API 启动前等待 Redis 和 PostgreSQL 健康。
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # readiness 检查核心依赖，失败时容器标记 unhealthy。
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 诊断 Worker：只消费 diagnosis 队列，避免被长索引任务阻塞。
  worker:
    build: .
    # 诊断包含大仓库源码扫描和证据关联，默认并发必须与 CPU/磁盘预算匹配。
    # 超出容量时任务会互相拖慢并触发单任务软超时；排队时间不计入任务软超时，
    # 因此默认 2 个执行槽比 Celery 根据 10 核自动开启 10 个进程更稳定。
    command: celery -A app.worker.celery_app worker --loglevel=INFO -Q diagnosis --concurrency=${DIAGNOSIS_WORKER_CONCURRENCY:-2}
    env_file:
      - .env
    # 诊断 Worker 与 API 使用完全相同的项目只读视图。
    volumes: *ragent-repositories
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # 通过 Celery control 通道确认诊断 Worker 进程能响应控制消息。
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.worker.celery_app inspect ping -d "celery@$$HOSTNAME" --timeout=5 | grep -q pong
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # 文档索引 Worker：只消费 index 队列，可与诊断 Worker 独立扩缩容。
  index-worker:
    build: .
    # 文档索引与诊断相互隔离，默认单并发避免大型仓库嵌入计算争抢 CPU。
    command: celery -A app.worker.celery_app worker --loglevel=INFO -Q index --concurrency=${INDEX_WORKER_CONCURRENCY:-1}
    env_file:
      - .env
    # 索引 Worker 使用同一只读项目视图，避免分析与索引读取不同代码快照。
    volumes: *ragent-repositories
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # 独立探测索引 Worker，避免诊断 Worker 在线时掩盖索引队列故障。
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.worker.celery_app inspect ping -d "celery@$$HOSTNAME" --timeout=5 | grep -q pong
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # Redis：验证限流、LLM 缓存、Celery broker 和结果后端。
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # PostgreSQL：保存 RAgent 元数据、证据、反馈、索引和安全审计。
  postgres:
    image: postgres:16-alpine
    # 本地默认账号仅供开发；生产必须替换密码并使用外部托管数据库。
    environment:
      POSTGRES_DB: ragent
      POSTGRES_USER: ragent
      POSTGRES_PASSWORD: ragent
    # 命名卷持久化 PostgreSQL 数据，不能使用临时容器文件系统。
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragent -d ragent"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 维护 profile：显式执行数据库备份，不参与普通 docker compose up。
  backup:
    image: postgres:16-alpine
    # 仅维护命令启用，普通启动不会创建备份容器。
    profiles: ["maintenance"]
    command: ["sh", "/scripts/backup_metadata.sh"]
    # PostgreSQL 连接和备份目标参数；密码在生产中应由 Secret 管理。
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ragent
      PGUSER: ragent
      PGPASSWORD: ragent
      BACKUP_DIR: /backups
      # 控制保留的 RAgent 备份份数，默认 7。
      BACKUP_KEEP: "${BACKUP_KEEP:-7}"
    # 脚本只读挂载；备份文件写入被 Git 忽略的宿主 backups/ 目录。
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    # 备份前必须等待 PostgreSQL 可连接。
    depends_on:
      postgres:
        condition: service_healthy

# 持久化数据库数据卷。
volumes:
  postgres_data:
