<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PHP 代码诊断 RAgent</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: #f5f7fb; color: #202637; }
      main { max-width: 980px; margin: 0 auto; padding: 32px 20px 60px; }
      h1 { margin: 0 0 24px; font-size: 28px; }
      h2 { margin-top: 28px; font-size: 20px; }
      .card { background: #fff; border: 1px solid #e2e6ef; border-radius: 12px; padding: 20px; margin-bottom: 18px; box-shadow: 0 4px 16px #1e2a3a0d; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #586174; }
      textarea, input, select { box-sizing: border-box; width: 100%; border: 1px solid #cfd6e4; border-radius: 8px; padding: 10px; font: inherit; color: #202637; }
      textarea { min-height: 100px; resize: vertical; }
      .wide { grid-column: 1 / -1; }
      button, a.button { display: inline-block; border: 0; border-radius: 8px; padding: 10px 15px; background: #315efb; color: #fff; cursor: pointer; text-decoration: none; font: inherit; }
      button.secondary, a.secondary { background: #e9edf7; color: #26324a; }
      button:disabled { opacity: .55; cursor: not-allowed; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
      .status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .metric { background: #f7f9fd; border-radius: 8px; padding: 12px; }
      .metric small { display: block; color: #657087; margin-bottom: 5px; }
      .metric strong { word-break: break-word; }
      pre { overflow: auto; white-space: pre-wrap; background: #172033; color: #eff3fb; border-radius: 8px; padding: 14px; min-height: 80px; }
      .muted { color: #657087; }
      .history-item { display: block; width: 100%; margin: 6px 0; text-align: left; background: #f7f9fd; color: #26324a; }
      .error { color: #b42318; }
      @media (max-width: 680px) { .grid, .status { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>PHP 代码诊断 RAgent</h1>
      <section class="card">
        <form id="diagnosis-form">
          <div class="grid">
            <label>项目<input id="project" name="project" value="waky3" required maxlength="100" /></label>
            <label>环境<input id="environment" name="environment" value="development" maxlength="100" /></label>
            <label class="wide">API Key<input id="api-key" type="password" autocomplete="off" placeholder="启用访问控制时填写，仅保存在当前页面内存" /></label>
            <label class="wide"><span><input id="use-ai" type="checkbox" checked /> 使用 AI 诊断叙写（可能产生模型费用）</span></label>
            <label class="wide">问题<textarea id="question" name="question" placeholder="例如：公会邀请失败可能是什么原因？" required maxlength="10000"></textarea></label>
          </div>
          <div class="actions">
            <button id="submit" type="submit">开始诊断</button>
            <span id="message" class="muted" role="status">等待输入问题</span>
          </div>
        </form>
      </section>

      <section class="card" aria-live="polite">
        <h2>任务进度</h2>
        <div class="status">
          <div class="metric"><small>任务 ID</small><strong id="task-id">-</strong></div>
          <div class="metric"><small>状态</small><strong id="task-status">-</strong></div>
          <div class="metric"><small>进度</small><strong id="task-progress">-</strong></div>
        </div>
        <p id="task-step" class="muted">尚未创建任务</p>
        <div class="actions">
          <a id="report-link" class="button secondary" href="#" hidden>下载 Markdown 报告</a>
          <button id="copy-report" class="secondary" type="button" disabled>复制报告</button>
          <button id="cancel-task" class="secondary" type="button" hidden>取消任务</button>
          <button id="retry-task" class="secondary" type="button" hidden>重新执行失败任务</button>
        </div>
      </section>

      <section class="card">
        <h2>操作轨迹</h2>
        <pre id="operation-list">选择任务后可查看创建、取消和重试记录。</pre>
      </section>

      <section class="card">
        <h2>历史任务</h2>
        <div class="grid">
          <label>状态
            <select id="history-status">
              <option value="">全部状态</option>
              <option value="COMPLETED">已完成</option>
              <option value="FAILED">失败</option>
              <option value="CANCELLED">已取消</option>
              <option value="RUNNING">执行中</option>
            </select>
          </label>
          <label>最近天数<input id="history-days" type="number" min="1" max="3650" placeholder="不限" /></label>
          <label class="wide">请求 ID<input id="history-request-id" maxlength="128" placeholder="从访问日志中的 X-Request-ID 定位任务" /></label>
        </div>
        <div class="actions">
          <button id="history-load" class="secondary" type="button">加载最近任务</button>
          <button id="history-more" class="secondary" type="button" hidden>加载更多</button>
          <span id="history-message" class="muted" role="status">可按项目查看历史任务</span>
        </div>
        <div id="history-list" class="muted">暂无历史任务。</div>
        <p id="project-summary" class="muted">项目反馈摘要：暂无数据</p>
        <p id="ai-quality" class="muted">AI 质量摘要：暂无数据</p>
      </section>

      <section class="card">
        <h2>报告预览</h2>
        <pre id="report">完成诊断后可在这里预览 Markdown 报告。</pre>
      </section>

      <section class="card">
        <h2>人工反馈</h2>
        <form id="feedback-form">
          <div class="grid">
            <label>反馈类型
              <select id="rating" required>
                <option value="correct">正确</option>
                <option value="inaccurate">不准确</option>
                <option value="insufficient_evidence">证据不足</option>
                <option value="escalate">转人工</option>
              </select>
            </label>
            <label>提交者<input id="submitted-by" maxlength="100" placeholder="可选" /></label>
            <label class="wide">说明<textarea id="comment" maxlength="2000" placeholder="可选，补充审阅意见"></textarea></label>
          </div>
          <div class="actions">
            <button id="feedback-submit" type="submit" disabled>提交反馈</button>
            <span id="feedback-message" class="muted" role="status">创建任务后可提交反馈</span>
          </div>
        </form>
        <pre id="feedback-list">暂无反馈。</pre>
      </section>
    </main>

    <script>
      // 用于展示任务状态、报告和反馈的最小前端示例，不依赖外部 JavaScript 包。
      const state = { taskId: null, eventController: null, historyOffset: 0 };
      const $ = (id) => document.getElementById(id);
      const nativeFetch = window.fetch.bind(window);

      /**
       * 为 API 请求附加当前页面内存中的 API Key。
       * @param {RequestInfo|URL} input 请求地址或 Request 对象。
       * @param {RequestInit} init 原始 fetch 配置。
       * @returns {Promise<Response>} 带认证头的 fetch Promise。
       */
      function apiFetch(input, init = {}) {
        const headers = new Headers(init.headers || {});
        const apiKey = $("api-key").value.trim();
        if (apiKey) headers.set("X-API-Key", apiKey);
        return nativeFetch(input, { ...init, headers });
      }

      /** 停止当前任务进度流，避免切换任务后保留旧连接。 */
      function stopWatching() {
        if (state.eventController) state.eventController.abort();
        state.eventController = null;
      }

      /**
       * 将 API 任务摘要同步到页面，并以纯文本方式渲染。
       * @param {Object} task 诊断任务状态摘要。
       */
      function renderTask(task) {
        $("task-id").textContent = task.task_id || "-";
        $("task-status").textContent = task.status || "-";
        $("task-progress").textContent = `${task.progress ?? 0}%`;
        $("task-step").textContent = task.current_step || "-";
        $("feedback-submit").disabled = !task.task_id;
        $("feedback-message").textContent = task.task_id ? "可以提交审阅意见" : "创建任务后可提交反馈";
        $("cancel-task").hidden = !["QUEUED", "RUNNING", "SEARCHING", "VERIFYING", "REPORTING"].includes(task.status);
        $("retry-task").hidden = task.status !== "FAILED";
      }

      /**
       * 拉取 Markdown 报告并在页面中以纯文本预览。
       * @param {string} taskId 诊断任务 ID。
       * @returns {Promise<void>}
       */
      async function loadReport(taskId) {
        const response = await apiFetch(`/api/diagnoses/${encodeURIComponent(taskId)}/report?format=markdown`);
        if (!response.ok) throw new Error(`报告获取失败（${response.status}）`);
        $("report").textContent = await response.text();
        $("copy-report").disabled = false;
      }

      /**
       * 拉取任务人工反馈和反馈类型统计。
       * @param {string} taskId 诊断任务 ID。
       * @returns {Promise<void>}
       */
      async function loadFeedback(taskId) {
        const base = `/api/diagnoses/${encodeURIComponent(taskId)}/feedback`;
        const [response, summaryResponse] = await Promise.all([apiFetch(base), apiFetch(`${base}/summary`)]);
        if (!response.ok || !summaryResponse.ok) throw new Error("反馈获取失败");
        const data = await response.json();
        const summary = await summaryResponse.json();
        const header = `共 ${summary.total} 条反馈：正确 ${summary.counts.correct}，不准确 ${summary.counts.inaccurate}，证据不足 ${summary.counts.insufficient_evidence}，转人工 ${summary.counts.escalate}`;
        $("feedback-list").textContent = data.feedback.length
          ? `${header}\n\n${data.feedback.map((item) => `${item.rating}：${item.comment || "（无说明）"}`).join("\n")}`
          : `${header}\n\n暂无反馈。`;
      }

      /**
       * 拉取任务创建、取消和重试操作审计轨迹。
       * @param {string} taskId 诊断任务 ID。
       * @returns {Promise<void>}
       */
      async function loadOperations(taskId) {
        const response = await apiFetch(`/api/diagnoses/${encodeURIComponent(taskId)}/operations?limit=100`);
        if (!response.ok) throw new Error(`操作轨迹获取失败（${response.status}）`);
        const data = await response.json();
        $("operation-list").textContent = data.operations.length
          ? data.operations.map((item) => `${item.operation} | ${item.from_status || "-"} → ${item.to_status || "-"} | ${item.actor || "系统"} | ${item.created_at}`).join("\n")
          : "暂无操作记录。";
      }

      /**
       * 使用 fetch 流读取 SSE，以便认证模式下携带 API Key。
       * @param {string} taskId 诊断任务 ID。
       * @returns {Promise<void>}
       */
      async function watchTask(taskId) {
        stopWatching();
        const controller = new AbortController();
        state.eventController = controller;
        try {
          const response = await apiFetch(`/api/diagnoses/${encodeURIComponent(taskId)}/events`, { signal: controller.signal });
          if (!response.ok) {
            let message = `进度连接失败（${response.status}）`;
            try { message = (await response.json()).detail || message; } catch (error) { /* 非 JSON 错误保持状态码提示 */ }
            throw new Error(message);
          }
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const blocks = buffer.split("\n\n");
            buffer = blocks.pop();
            for (const block of blocks) {
              const data = block.split("\n").filter((line) => line.startsWith("data:")).map((line) => line.slice(5).trim()).join("\n");
              if (!data) continue;
              const task = JSON.parse(data);
              renderTask(task);
              if (["COMPLETED", "FAILED", "CANCELLED"].includes(task.status)) {
                stopWatching();
                loadReport(taskId).catch((error) => { $("report").textContent = error.message; });
                loadFeedback(taskId).catch((error) => { $("feedback-list").textContent = error.message; });
                loadOperations(taskId).catch((error) => { $("operation-list").textContent = error.message; });
                return;
              }
            }
          }
        } catch (error) {
          if (error.name !== "AbortError") $("message").textContent = error.message || "进度连接已断开，可刷新页面重试";
        }
      }

      /**
       * 创建诊断任务并订阅执行进度。
       * @param {SubmitEvent} event 诊断表单提交事件。
       * @returns {Promise<void>}
       */
      $("diagnosis-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        $("submit").disabled = true;
        $("message").textContent = "正在创建任务…";
        const payload = {
          project: $("project").value.trim(),
          environment: $("environment").value.trim() || "development",
          question: $("question").value.trim(),
          use_ai: $("use-ai").checked,
        };
        try {
          const response = await apiFetch("/api/diagnoses", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
          if (!response.ok) throw new Error(`任务创建失败（${response.status}）`);
          const task = await response.json();
          state.taskId = task.task_id;
          $("report-link").href = `/api/diagnoses/${encodeURIComponent(state.taskId)}/report?format=markdown`;
          $("report-link").hidden = false;
          $("message").textContent = "任务已创建，正在等待进度…";
          renderTask(task);
          watchTask(state.taskId);
          loadOperations(state.taskId).catch((error) => { $("operation-list").textContent = error.message; });
        } catch (error) {
          $("message").textContent = error.message;
        } finally {
          $("submit").disabled = false;
        }
      });

      /**
       * 提交当前任务人工反馈并刷新反馈列表。
       * @param {SubmitEvent} event 反馈表单提交事件。
       * @returns {Promise<void>}
       */
      $("feedback-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!state.taskId) return;
        $("feedback-submit").disabled = true;
        try {
          const response = await apiFetch(`/api/diagnoses/${encodeURIComponent(state.taskId)}/feedback`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ rating: $("rating").value, comment: $("comment").value.trim() || null, submitted_by: $("submitted-by").value.trim() || null }),
          });
          if (!response.ok) throw new Error(`反馈提交失败（${response.status}）`);
          $("feedback-message").textContent = "反馈已提交";
          $("comment").value = "";
          await loadFeedback(state.taskId);
        } catch (error) {
          $("feedback-message").textContent = error.message;
        } finally {
          $("feedback-submit").disabled = false;
        }
      });

      /** 重新加载当前项目的最近诊断任务。 */
      $("history-load").addEventListener("click", async () => {
        state.historyOffset = 0;
        await loadHistory(false);
      });

      /**
       * 根据历史摘要创建纯文本任务按钮。
       * @param {Array<Object>} items 历史任务摘要集合。
       * @param {boolean} append 是否追加到已有列表。
       */
      function renderHistory(items, append) {
        const list = $("history-list");
        if (!append) list.replaceChildren();
        if (!items.length && !append) {
          list.textContent = "暂无历史任务。";
          return;
        }
        items.forEach((item) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "history-item";
          button.textContent = `${item.id} | ${item.status} | ${item.question}`;
          button.addEventListener("click", async () => {
            state.taskId = item.id;
            $("report-link").href = `/api/diagnoses/${encodeURIComponent(item.id)}/report?format=markdown`;
            $("report-link").hidden = false;
            renderTask({ task_id: item.id, status: item.status, progress: item.progress, current_step: item.current_step });
            try {
              await Promise.all([loadReport(item.id), loadFeedback(item.id), loadOperations(item.id)]);
              $("message").textContent = "已加载历史任务报告";
            } catch (error) {
              $("message").textContent = error.message;
            }
          });
          list.appendChild(button);
        });
      }

      /**
       * 分页加载历史任务并更新“加载更多”状态。
       * @param {boolean} append 是否追加到已有任务列表。
       * @returns {Promise<void>}
       */
      async function loadHistory(append) {
        const project = encodeURIComponent($("project").value.trim());
        const status = encodeURIComponent($("history-status").value);
        const days = encodeURIComponent($("history-days").value);
        const requestId = encodeURIComponent($("history-request-id").value.trim());
        $("history-message").textContent = "正在加载…";
        try {
          const filters = `project=${project}&offset=${state.historyOffset}&limit=20${status ? `&status=${status}` : ""}${days ? `&days=${days}` : ""}${requestId ? `&request_id=${requestId}` : ""}`;
          const response = await apiFetch(`/api/diagnoses/history?${filters}`);
          if (!response.ok) throw new Error(`历史任务获取失败（${response.status}）`);
          const data = await response.json();
          renderHistory(data.items, append);
          state.historyOffset += data.items.length;
          $("history-more").hidden = data.items.length < data.limit;
          $("history-message").textContent = `已加载 ${state.historyOffset} 条任务`;
          if (!append) await Promise.all([loadProjectSummary(), loadAiQuality()]);
        } catch (error) {
          $("history-message").textContent = error.message;
        }
      }

      $("history-more").addEventListener("click", () => loadHistory(true));

      /** 加载当前项目的反馈质量摘要。 */
      async function loadProjectSummary() {
        const project = encodeURIComponent($("project").value.trim());
        const response = await apiFetch(`/api/feedback/${project}/summary`);
        if (!response.ok) throw new Error(`项目反馈摘要获取失败（${response.status}）`);
        const data = await response.json();
        $("project-summary").textContent = `项目反馈摘要：共 ${data.total} 条，涉及 ${data.task_count} 个任务；正确 ${data.counts.correct}，不准确 ${data.counts.inaccurate}，证据不足 ${data.counts.insufficient_evidence}，转人工 ${data.counts.escalate}`;
      }

      /** 加载当前项目 AI 调用量、缓存、token、延迟和反馈质量摘要。 */
      async function loadAiQuality() {
        const project = encodeURIComponent($("project").value.trim());
        const days = encodeURIComponent($("history-days").value || "30");
        const [response, evaluationsResponse] = await Promise.all([
          apiFetch(`/api/ai/${project}/quality?days=${days}`),
          apiFetch(`/api/ai/${project}/evaluations?limit=1`),
        ]);
        if (!response.ok || !evaluationsResponse.ok) throw new Error("AI 质量摘要获取失败");
        const data = await response.json();
        const evaluations = await evaluationsResponse.json();
        const hitRate = `${Math.round(data.cache_hit_rate * 100)}%`;
        const latest = evaluations.runs[0];
        const evaluationText = latest
          ? `最近评测：通过 ${latest.passed}/${latest.executed}，跳过 ${latest.skipped}，证据召回 ${Math.round(latest.average_evidence_ref_recall * 100)}%`
          : "最近评测：暂无";
        $("ai-quality").textContent = `AI 质量摘要：${data.ai_tasks} 个任务，缓存命中 ${hitRate}，平均 ${data.latency_ms.avg}ms，消耗 ${data.tokens.total} tokens；正确 ${data.feedback.correct}，不准确 ${data.feedback.inaccurate}；${evaluationText}`;
      }

      /** 将当前失败任务重新排队并重新订阅执行进度。 */
      $("retry-task").addEventListener("click", async () => {
        if (!state.taskId) return;
        $("retry-task").disabled = true;
        $("message").textContent = "正在重新投递任务…";
        try {
          const response = await apiFetch(`/api/diagnoses/${encodeURIComponent(state.taskId)}/retry`, { method: "POST" });
          if (!response.ok) {
            const body = await response.json();
            throw new Error(body.detail || `任务重试失败（${response.status}）`);
          }
          const task = await response.json();
          renderTask(task);
          $("message").textContent = "任务已重新排队";
          watchTask(state.taskId);
          await loadOperations(state.taskId);
        } catch (error) {
          $("message").textContent = error.message;
        } finally {
          $("retry-task").disabled = false;
        }
      });

      /** 取消当前未结束任务并刷新任务状态。 */
      $("cancel-task").addEventListener("click", async () => {
        if (!state.taskId) return;
        $("cancel-task").disabled = true;
        try {
          const response = await apiFetch(`/api/diagnoses/${encodeURIComponent(state.taskId)}/cancel`, { method: "POST" });
          if (!response.ok) {
            const body = await response.json();
            throw new Error(body.detail || `任务取消失败（${response.status}）`);
          }
          const task = await response.json();
          stopWatching();
          renderTask(task);
          $("message").textContent = "任务已取消";
          await loadOperations(state.taskId);
        } catch (error) {
          $("message").textContent = error.message;
        } finally {
          $("cancel-task").disabled = false;
        }
      });

      /** 将当前 Markdown 报告文本写入剪贴板。 */
      $("copy-report").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText($("report").textContent);
          $("message").textContent = "报告已复制";
        } catch (error) {
          $("message").textContent = "复制失败，请手动选择报告内容";
        }
      });

      /**
       * 使用认证请求下载 Markdown 报告。
       * @param {MouseEvent} event 报告下载链接点击事件。
       * @returns {Promise<void>}
       */
      $("report-link").addEventListener("click", async (event) => {
        event.preventDefault();
        if (!state.taskId) return;
        try {
          const response = await apiFetch(`/api/diagnoses/${encodeURIComponent(state.taskId)}/report?format=markdown`);
          if (!response.ok) throw new Error(`报告下载失败（${response.status}）`);
          const url = URL.createObjectURL(await response.blob());
          const link = document.createElement("a");
          link.href = url;
          link.download = `${state.taskId}.md`;
          link.click();
          URL.revokeObjectURL(url);
        } catch (error) {
          $("message").textContent = error.message;
        }
      });
    </script>
  </body>
