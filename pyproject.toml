[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "php-diagnostic-ragent"
version = "0.1.0"
description = "Async PHP code diagnostic RAgent foundation"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "redis>=5.0,<6.0",
    "asyncpg>=0.29,<1.0",
    "celery[redis]>=5.3,<6.0"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.26,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

