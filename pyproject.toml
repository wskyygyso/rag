# Python 打包后端：使用 setuptools 生成应用安装包。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# 项目元数据和最低 Python 版本。
name = "php-diagnostic-ragent"
version = "0.1.0"
description = "Async PHP code diagnostic RAgent foundation"
requires-python = ">=3.11"
dependencies = [
    # HTTP API、Web 服务和配置模型。
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic-settings>=2.0,<3.0",
    # Redis、PostgreSQL 和 Celery 异步任务依赖。
    # Kombu 5.7 的 Redis transport 要求 redis-py 6.4+，版本范围必须与其同步。
    "redis>=6.4,<9.0",
    "asyncpg>=0.29,<1.0",
    "celery[redis]>=5.7,<6.0",
    # LLM HTTP 调用和性能基线脚本。
    "httpx>=0.26,<1.0"
]

[project.optional-dependencies]
# 本地开发和 CI 专用依赖，不安装到最小生产运行时。
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "PyYAML>=6.0,<7.0"
]

# 只打包 app 包，避免把 tests 和临时脚本发布为运行时模块。
[tool.setuptools.packages.find]
include = ["app*"]

# pytest 默认测试目录和异步测试模式。
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

