groups:
  - name: php-diagnostic-ragent
    rules:
      - alert: RagentDatabaseMetricsDown
        expr: ragent_database_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: RAgent 数据库指标采集失败
          description: 指标接口连续 2 分钟无法读取 PostgreSQL，请检查数据库连接和任务表。

      - alert: RagentHttpErrorRateHigh
        expr: |
          (
            sum(rate(ragent_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(ragent_http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: RAgent HTTP 5xx 比例超过 5%
          description: 最近 5 分钟服务端错误比例持续过高。

      - alert: RagentHttpP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(ragent_http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: RAgent HTTP P95 延迟超过 2 秒
          description: 最近 5 分钟 API P95 延迟持续过高，请检查数据库和队列依赖。

      - alert: RagentInFlightRequestsHigh
        expr: ragent_http_in_flight_requests > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: RAgent 并发请求持续过高
          description: 当前并发请求持续超过 100，请检查慢请求和下游依赖。

      - alert: RagentSecurityDenialsSpike
        expr: sum(increase(ragent_security_denials_total[5m])) > 20
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: RAgent 认证或授权拒绝短时激增
          description: 最近 5 分钟安全拒绝超过 20 次，请检查异常访问或密钥配置。

      - alert: RagentTaskRetrySpike
        expr: sum(increase(ragent_task_operations_total{operation="RETRY"}[10m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: RAgent 诊断任务重试次数异常
          description: 最近 10 分钟人工重试超过 5 次，请检查 Worker 和外部依赖。

      - alert: RagentFailedTasksPresent
        expr: sum(ragent_diagnosis_tasks{status="FAILED"}) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: RAgent 存在较多失败诊断任务
          description: 当前失败任务累计超过 5 个，请检查失败原因和重试状态。

      - alert: RagentMetricsCollectionErrors
        expr: increase(ragent_database_metrics_collection_errors_total[10m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: RAgent 指标采集连续失败
          description: 最近 10 分钟数据库指标采集失败次数超过 2 次。
