# RAgent 生产单机/受控主机编排：只包含应用进程，PostgreSQL 和 Redis 使用托管生产服务。
# 使用不可变镜像、只读根文件系统、非 root 用户和外部 Secret 注入；不包含开发数据库密码。

# 所有应用容器共用的生产运行配置；真实值由部署平台 Secret Manager 注入。
x-ragent-environment: &ragent-environment
  APP_ENV: production
  APP_NAME: ${APP_NAME:-php-diagnostic-ragent}
  APP_HOST: 0.0.0.0
  APP_PORT: "8000"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CODE_REPOSITORIES_ROOT: /repositories
  AUTH_ENABLED: "true"
  API_KEYS_JSON: ${API_KEYS_JSON:?API_KEYS_JSON 必须由 Secret Manager 注入}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1000000}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL 必须由 Secret Manager 注入}
  VALIDATION_DATABASE_URL: ${VALIDATION_DATABASE_URL:?VALIDATION_DATABASE_URL 必须配置独立只读库}
  REDIS_URL: ${REDIS_URL:?REDIS_URL 必须配置生产 Redis}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL 必须配置生产队列 Redis DB}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND 必须配置生产结果 Redis DB}
  DIAGNOSIS_TASK_SOFT_TIME_LIMIT_SECONDS: ${DIAGNOSIS_TASK_SOFT_TIME_LIMIT_SECONDS:-240}
  DIAGNOSIS_TASK_TIME_LIMIT_SECONDS: ${DIAGNOSIS_TASK_TIME_LIMIT_SECONDS:-300}
  DOCUMENT_INDEX_SOFT_TIME_LIMIT_SECONDS: ${DOCUMENT_INDEX_SOFT_TIME_LIMIT_SECONDS:-900}
  DOCUMENT_INDEX_TIME_LIMIT_SECONDS: ${DOCUMENT_INDEX_TIME_LIMIT_SECONDS:-960}
  DIAGNOSTIC_TASK_RETENTION_DAYS: ${DIAGNOSTIC_TASK_RETENTION_DAYS:-90}
  VALIDATION_AUDIT_RETENTION_DAYS: ${VALIDATION_AUDIT_RETENTION_DAYS:-180}
  SECURITY_AUDIT_RETENTION_DAYS: ${SECURITY_AUDIT_RETENTION_DAYS:-180}
  DOCUMENT_INDEX_RETENTION_DAYS: ${DOCUMENT_INDEX_RETENTION_DAYS:-90}
  LLM_ENABLED: ${LLM_ENABLED:-false}
  LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/responses}
  LLM_API_PROTOCOL: ${LLM_API_PROTOCOL:-auto}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
  LLM_MIN_EVIDENCE_ITEMS: ${LLM_MIN_EVIDENCE_ITEMS:-1}
  LLM_CACHE_ENABLED: ${LLM_CACHE_ENABLED:-true}
  LLM_CACHE_TTL_SECONDS: ${LLM_CACHE_TTL_SECONDS:-3600}
  EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
  EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-512}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
  EMBEDDING_CONCURRENCY: ${EMBEDDING_CONCURRENCY:-2}
  EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-3}
  EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-60}
  EMBEDDING_SEND_DIMENSIONS: ${EMBEDDING_SEND_DIMENSIONS:-true}
  SEMANTIC_VECTOR_MIN_SIMILARITY: ${SEMANTIC_VECTOR_MIN_SIMILARITY:-0.30}
  SEMANTIC_VECTOR_STRONG_SIMILARITY: ${SEMANTIC_VECTOR_STRONG_SIMILARITY:-0.40}
  SEMANTIC_VECTOR_CANDIDATE_LIMIT: ${SEMANTIC_VECTOR_CANDIDATE_LIMIT:-40}
  SEMANTIC_VECTOR_SCAN_LIMIT: ${SEMANTIC_VECTOR_SCAN_LIMIT:-20000}

# 应用容器的容器级安全边界；不向工作负载授予额外 Linux capability。
x-ragent-security: &ragent-security
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m
  restart: unless-stopped
  stop_grace_period: 60s
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  # HTTP API：只绑定本机或指定内网地址，由 TLS 反向代理对外提供服务。
  api:
    image: ${RAGENT_IMAGE:?RAGENT_IMAGE 必须使用不可变 tag 或 digest}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=${TRUSTED_PROXY_IPS:-127.0.0.1}
    environment: *ragent-environment
    ports:
      - ${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000
    volumes:
      # 被诊断仓库只读挂载，API 和 Worker 均不能修改业务代码。
      - ${RAGENT_REPOSITORIES_ROOT:?RAGENT_REPOSITORIES_ROOT 必须指向只读仓库根目录}:/repositories:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *ragent-security

  # 诊断 Worker：只消费 diagnosis 队列，可与索引 Worker 独立扩缩容。
  worker:
    image: ${RAGENT_IMAGE:?RAGENT_IMAGE 必须使用不可变 tag 或 digest}
    command: celery -A app.worker.celery_app worker --loglevel=${LOG_LEVEL:-INFO} -Q diagnosis --concurrency=${DIAGNOSIS_WORKER_CONCURRENCY:-2}
    environment: *ragent-environment
    volumes:
      - ${RAGENT_REPOSITORIES_ROOT:?RAGENT_REPOSITORIES_ROOT 必须指向只读仓库根目录}:/repositories:ro
    # 通过 Celery control 通道确认诊断 Worker 能响应，而不仅是容器进程仍在运行。
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.worker.celery_app inspect ping -d "celery@$$HOSTNAME" --timeout=5 | grep -q pong
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    <<: *ragent-security

  # 文档索引 Worker：只消费 index 队列，避免长索引任务阻塞在线诊断。
  index-worker:
    image: ${RAGENT_IMAGE:?RAGENT_IMAGE 必须使用不可变 tag 或 digest}
    command: celery -A app.worker.celery_app worker --loglevel=${LOG_LEVEL:-INFO} -Q index --concurrency=${INDEX_WORKER_CONCURRENCY:-1}
    environment: *ragent-environment
    volumes:
      - ${RAGENT_REPOSITORIES_ROOT:?RAGENT_REPOSITORIES_ROOT 必须指向只读仓库根目录}:/repositories:ro
    # 独立探测索引 Worker，确保索引队列消费者没有被错误标记为健康。
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.worker.celery_app inspect ping -d "celery@$$HOSTNAME" --timeout=5 | grep -q pong
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    <<: *ragent-security
